<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --bg: #0f0f0f;
      --card: #1a1a1a;
      --accent-blue: #0078d4;
      --accent-orange: #ff9500;
      --text: #ffffff;
      --border: #333;
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    h1 { 
      margin: 40px 0; 
      letter-spacing: 1px; 
      text-transform: uppercase; 
      font-size: clamp(18px, 5vw, 24px); 
      color: #aaa; 
      text-align: center;
    }

    .container { 
      display: grid;
      grid-template-columns: 1fr; /* Une colonne par défaut (mobile) */
      gap: 20px; 
      width: 100%;
      max-width: 800px;
      margin-bottom: 40px;
    }

    /* Tablettes et PC */
    @media (min-width: 650px) {
      .container {
        grid-template-columns: 1fr 1fr; /* Deux colonnes sur PC */
      }
      body { justify-content: center; } /* Centre verticalement sur grand écran */
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 30px 20px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-tap-highlight-color: transparent; /* Optimisation mobile */
    }

    .card:active { transform: scale(0.98); } /* Feedback tactile */

    @media (min-width: 1024px) {
      .card:hover {
        transform: translateY(-8px);
        border-color: #555;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      }
    }

    .card.aspirateur { border-bottom: 4px solid #444; }
    .card.automate { border-bottom: 4px solid #444; }
    
    .card.aspirateur:hover, .card.aspirateur:active { border-bottom-color: var(--accent-orange); }
    .card.automate:hover, .card.automate:active { border-bottom-color: var(--accent-blue); }
    
    .icon { font-size: 45px; margin-bottom: 15px; }
    .title { font-size: 20px; font-weight: bold; margin-bottom: 12px; }
    .desc { font-size: 14px; color: #888; line-height: 1.5; max-width: 220px; }
    
    #loader { 
      color: var(--accent-blue); 
      font-size: 14px; 
      margin-top: 20px;
      font-style: italic;
    }

    /* Animation de chargement discrète */
    .dot-flashing {
      display: inline-block;
      position: relative;
      width: 10px;
      height: 10px;
      border-radius: 5px;
      background-color: var(--accent-blue);
      animation: dot-flashing 1s infinite linear alternate;
    }
    @keyframes dot-flashing { 0% { opacity: 1; } 100% { opacity: 0.2; } }
  </style>
</head>
<body>

  <h1>Plateforme News & IA</h1>

  <div class="container" id="menu" style="display:none;">
    <a id="link-aspirateur" class="card aspirateur" href="#">
      <span class="icon">📡</span>
      <span class="title">Aspirateur</span>
      <span class="desc">Collecte et surveillance des flux RSS en temps réel.</span>
    </a>

    <a id="link-automate" class="card automate" href="#">
      <span class="icon">🤖</span>
      <span class="title">Automate</span>
      <span class="desc">Synthèse intelligente des dépêches par IA Gemini.</span>
    </a>
  </div>

  <div id="loader">
    <div class="dot-flashing"></div> Initialisation du Hub...
  </div>

  <script>
    window.onload = function() {
      google.script.run.withSuccessHandler(function(url) {
        document.getElementById('link-aspirateur').href = url + "?app=aspirateur";
        document.getElementById('link-automate').href = url + "?app=automate";
        document.getElementById('loader').style.display = 'none';
        document.getElementById('menu').style.display = 'grid';
      }).getScriptUrl();
    };
  </script>
</body>
</html>
